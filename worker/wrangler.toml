# Receives "Poslať správu" and "Zavolajte mi" from the PROMARKT site and forwards them to the surveyor's Telegram.
# Secrets are never in this file. They are set with `wrangler secret put NAME`:
# TURNSTILE_SECRET, TELEGRAM_TOKEN, TELEGRAM_CHAT.
name = "promarkt-lead"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[vars]
ALLOWED_ORIGINS = "https://dancenitra.github.io,http://127.0.0.1:4173,http://localhost:4173"

# Per-visitor limit on top of the captcha: 5 requests a minute from one IP address.
[[ratelimits]]
name = "LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
